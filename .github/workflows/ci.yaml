
on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto
      - uses: go-task/setup-task@v2
      - run: task
