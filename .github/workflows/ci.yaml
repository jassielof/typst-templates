name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
      - name: Install Task
        uses: go-task/setup-task@v2
      - name: Build templates
        run: task
