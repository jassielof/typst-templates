name: CI

on:
  - push
  - pull_request

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Cache fonts
        id: cache-fonts
        uses: actions/cache@v6
        with:
          path: ~/.local/share/fonts
          key: ${{ runner.os }}-fonts-${{ hashFiles('.github/fonts.txt') }}
      - name: Install fonts
        if: steps.cache-fonts.outputs.cache-hit != 'true'
        run: |
          brew install --cask $(cat .github/fonts.txt | tr '\n' ' ')
      - name: Install Typst
        uses: typst-community/setup-typst@v5
      - name: Install Task
        uses: go-task/setup-task@v2
      - name: Build templates
        run: task
      - name: README
        run: |
          sudo gem install asciidoctor
          task www
          asciidoctor README.adoc -o www/index.html
      - name: Upload page artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: www
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v5
